<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      BRAND VALUES ARE REPEATED HERE because index.html cannot import
      src/lib/brand.ts. The brand regression checks read this file and fail if
      the title, description or site name drift from brand.ts.
    -->
    <title>CourseScope — UK Physics &amp; Engineering Course Finder</title>
    <meta
      name="description"
      content="Compare UK university Physics and Engineering courses, published A-Level entry requirements, admissions tests and application routes."
    />
    <meta name="application-name" content="CourseScope" />
    <meta name="theme-color" content="#152344" />

    <!--
      Robots: index and follow, explicitly. A static catalogue of public course
      information is meant to be findable.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <!--
      No canonical link, og:url or og:image HERE, on purpose. All three need an
      absolute URL, and a relative or guessed one is worse than none.
      src/lib/site-meta.ts adds canonical and og:url at boot from VITE_SITE_URL,
      and og:image from VITE_OG_IMAGE_URL, and adds nothing for a variable that
      is not set.
    -->

    <!--
      The CourseScope mark: an open ring with a focal point. SVG, so it is sharp
      at every size; identical geometry to src/components/BrandMark.tsx.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CourseScope" />
    <meta property="og:title" content="CourseScope — UK Physics &amp; Engineering Course Finder" />
    <meta
      property="og:description"
      content="Compare UK university Physics and Engineering courses, published A-Level entry requirements, admissions tests and application routes."
    />
    <!-- Upgraded to summary_large_image by site-meta.ts only when an image URL is configured. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CourseScope — UK Physics &amp; Engineering Course Finder" />
    <meta
      name="twitter:description"
      content="Compare UK university Physics and Engineering courses, published A-Level entry requirements, admissions tests and application routes."
    />
  </head>
  <body>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
