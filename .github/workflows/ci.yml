# CourseScope — CI and GitHub Pages deployment.
#
# Every push and pull request runs the full release chain (`verify`). Pushes to
# `main` then deploy the SAME checked build to GitHub Pages (`deploy`), which
# only runs after `verify` passes — a failing check never reaches production.

name: CI and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, assertions, build, browser QA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install (from the lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # engine-check.ts: engine, parser, importer, identity invariant, catalogue
      # validation (0 errors) and duplicate detection (0 duplicates), brand and
      # entry-year checks. Exits non-zero on any failure.
      - name: Assertions, validation and duplicate checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Playwright (Chromium) for browser QA
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Browser QA against the production preview
        run: |
          npx vite preview --port 4321 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          node smoke.v09.mjs | tee qa.log
          grep -q "RELEASE QA RESULT: .* 0 fail, 0 page errors, 0 product console errors" qa.log

      - name: Upload the checked build for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
